<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: 'Microsoft YaHei', sans-serif; width: 250px; padding: 20px; background: #f8f9fa; color: #333; margin: 0; text-align: center; }
    h3 { margin-top: 0; color: #1a73e8; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    p { font-size: 13px; color: #555; line-height: 1.5; }
    .btn { display: inline-block; padding: 8px 16px; background: #1a73e8; color: white; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px; margin-top: 10px; cursor: pointer; border: none; }
    .btn:hover { background: #1557b0; }
  </style>
</head>
<body>
  <h3>UOM 助手 v1.4</h3>
  <p>为了让您更方便地控制脚本，所有的<strong>功能开关（全站验证码自动填入、培训助手）</strong>已全部转移至网页右侧的<strong>黑色悬浮控制面板</strong>中！</p>
  <p style="color: #d93025; font-weight: bold;">请在 UOM 网页内操作：首页设置自动填入，二级菜单进入培训助手。关闭面板将停止任务，刷新网页可重新显示。</p>
  <button class="btn" id="close-btn">我知道了</button>
  <script src="popup.js"></script>
</body>
</html>
